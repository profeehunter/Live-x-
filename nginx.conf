worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 8080;
        server_name _;

        # Serve HLS fragments generated by RTMP module
        location /hls {
            types { }
            default_type application/vnd.apple.mpegurl;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
            alias /tmp/hls/;
        }

        # Serve the viewer page from / (index.html)
        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        # Serve files under root (css/js if any)
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ =404;
        }
    }
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;

            # HLS settings
            hls on;
            hls_path /tmp/hls;
            hls_fragment 3s;
            hls_playlist_length 9s;
            hls_cleanup on;

            # optional: record streams
            # record all;
            # record_path /tmp/records;
        }
    }
}